<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    {% if site.author.cv %}
    <a class="masthead__cv" href="{{ site.author.cv }}" download="{{ site.author.name }}_中文学术简历.pdf"><i class="fas fa-fw fa-download" aria-hidden="true"></i><span class="masthead__cv-long"> 下载 PDF 简历</span><span class="masthead__cv-short"> PDF 简历</span></a>
    {% endif %}
  </div>
</div>
